name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: only what deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the origin is the database key, so a half-applied
# deploy is worse than a slightly stale one.
concurrency:
  # A skipped manual branch run must not cancel a main deployment.
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    # Manual runs on feature branches must never publish their checkout.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Inventory and storage tests guard the data before publishing.
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
