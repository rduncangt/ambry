  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#faf6f0" />

  <title>Ambry · Text editing check</title>
  <style>
    /* INLINE_APP_CSS */
    .check-page { padding: calc(24px + env(safe-area-inset-top)) 16px 24px; display: flex; flex-direction: column; gap: 16px; }
    .check-page section { display: flex; flex-direction: column; gap: 12px; }
    .check-page h1 { font-size: 24px; }
    .check-page h2, .check-plain h2 { font-size: 18px; }
    .check-page a { display: inline-flex; min-height: 44px; align-items: center; }
    .check-plain { padding: 16px; background: var(--card); }
    .check-plain h2 { margin-bottom: 12px; }
    .check-page textarea { width: 100%; }
